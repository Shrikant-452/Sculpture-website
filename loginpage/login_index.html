<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Login Page</title>

<link rel="stylesheet" href="logincss.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
// --- GOOGLE LOGIN ---
function handleCredentialResponse(response){
    console.log("Google Token:", response.credential);
    alert("Login Successful!");
    window.location.href = "shopping_page.html";
}

// --- ADMIN LOGIN ---
function toggleAdmin(){
    document.getElementById("adminForm").classList.toggle("show");
}

function gotoShop(){
    window.location.href = "shopping_page.html";
}

// --- USER LOGIN ---
function login(){
    let user = document.getElementById("loginUser").value;
    let pass = document.getElementById("loginPass").value;

    let storedUser = localStorage.getItem("username");
    let storedPass = localStorage.getItem("password");

    // Check if credentials match local storage
    if(user === storedUser && pass === storedPass && user !== null && user !== ""){
        localStorage.setItem("isLoggedIn", "true");
        window.location.href = "/Sculpture-website/shoping-page/shopping_page.html";
    } else {
        alert("Invalid Username or Password. Have you signed up yet?");
    }
}

// --- USER SIGNUP ---
function toggleSignup(){
    let box = document.getElementById("signupBox");
    box.classList.toggle("show");
}

function signup(){
    let user = document.getElementById("signupUser").value;
    let pass = document.getElementById("signupPass").value;

    if(user === "" || pass === "") {
        alert("Please enter a username and password.");
        return;
    }

    localStorage.setItem("username", user);
    localStorage.setItem("password", pass);

    alert("Account Created Successfully! You can now log in.");

    document.getElementById("signupUser").value = "";
    document.getElementById("signupPass").value = "";
}
</script>

</head>

<body>
<div class="container">

    <div class="logo-container"></div>
    <div class="login-box">

        <h1 id="text-login">Sculpture login..</h1>
        <br><br><br>

        <div class="user-box">
            <h2>User Login</h2>
            <input type="text" id="loginUser" placeholder="Username">
            <input type="password" id="loginPass" placeholder="Password">
            <button class="login-btn" onclick="login()">Login</button><br><br>

            <p class="signup-text">Don't have an account?</p>
            <button class="signup-toggle" onclick="toggleSignup()">Sign Up</button>

            <div class="signup-box" id="signupBox">
                <input type="text" id="signupUser" placeholder="Create Username">
                <input type="password" id="signupPass" placeholder="Create Password">
                <button class="create-btn" onclick="signup()">Create Account</button>
            </div>
        </div>

        <div class="google-box">
            <h2>User Login With</h2>
            <div id="g_id_onload"
                data-client_id="188766982362-u8t1496fdhb690vfqk303isjida2as9a.apps.googleusercontent.com"
                data-callback="handleCredentialResponse">
            </div>
            <div class="g_id_signin" data-type="standard" data-size="large"></div>
        </div>

        <br><br>
        <div class="admin-box">
            <button onclick="toggleAdmin()" class="admin-title">Admin Login</button>
            <div class="admin-form" id="adminForm">
                <input type="email" placeholder="Admin Email">
                <input type="password" placeholder="Password">
                <button class="admin-btn" onclick="gotoShop()">Login</button>
            </div>
        </div>

    </div>

    <div class="image-box"></div>

</div>
</body>
</html>
