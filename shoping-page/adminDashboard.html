<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <title>Modern Sculpture Studio</title>
    <link
      rel="shortcut icon"
      href="/Sculpture-website/image/web_img.png"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="admin.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <!-- SIDEBAR -->
    <div class="sidebar">
      <h2>Admin Panel</h2>
      <button onclick="showSection('dashboard')">Dashboard</button>
      <button onclick="showSection('products')">Products</button>
      <button onclick="showSection('orders')">Orders</button>
      <button onclick="showSection('users')">Users</button>
    </div>

    <!-- MAIN -->
    <div class="main">
      <div class="header">
        <input
          id="search"
          placeholder="Search products..."
          onkeyup="searchProduct()"
        />
        <button onclick="toggleDark()" type="button">Dark Mode</button>
      </div>

      <!-- DASHBOARD -->
      <div id="dashboard">
        <div class="cards">
          <div class="card">
            <h3 id="productCount">0</h3>
            <p>Products</p>
          </div>

          <div class="card">
            <h3 id="userCount">0</h3>
            <p>Users</p>
          </div>

          <div class="card">
            <h3 id="orderCount">0</h3>
            <p>Orders</p>
          </div>

          <div class="card">
            <h3 id="salesCount">₹0</h3>
            <p>Total Sales</p>
          </div>
        </div>

        <canvas id="salesChart"></canvas>
      </div>

      <!-- PRODUCTS -->
      <div id="products" style="display: none">
        <div class="form">
          <input id="pname" placeholder="Product name" />
          <input id="pprice" placeholder="Price" />
          <input type="file" id="pimage" />

          <button class="btn add" onclick="addProduct()">Add Product</button>
        </div>

        <table>
          <thead>
            <tr>
              <th style="width: 80px">Image</th>
              <th style="width: 80px">Name</th>
              <th style="width: 120px">Price</th>
              <th style="width: 100px">Delete</th>
            </tr>
          </thead>

          <tbody id="productTable"></tbody>
        </table>
      </div>

      <!-- USERS -->

      <div id="users" style="display: none">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone No</th>
            </tr>
          </thead>

          <tbody id="userTable"></tbody>
        </table>
      </div>

      <!-- ORDERS -->

      <div id="orders" style="display: none">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Product</th>
              <th>User</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="orderTable"></tbody>
        </table>
      </div>
    </div>
    <script src="admin.js"></script>
  </body>
</html>
