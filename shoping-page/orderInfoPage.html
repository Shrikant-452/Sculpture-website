<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="shopping.css" />
    <link rel="stylesheet" href="media-quary.css" />
     <link rel="shortcut icon" href="/Sculpture-website/image/web_img.png" type="image/x-icon">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <title>Modern Sculpture Studio</title>
  </head>

  <body>
    <header class="head-section">
      <div class="logo-container"></div>
      <nav class="navbar">
        <form>
          <div class="main-container">
            <div class="search-bar">
              <div class="category">
                <select type="dropdown" title="select">
                  <option>ALL</option>
                  <option>Hindu Statues</option>
                  <option>Brass Statues</option>
                </select>
              </div>
              <input type="text" placeholder="Search beautiful sculpture" />

              <button type="button" title="button" class="search-btn">
                <i class="bi bi-search"></i>
              </button>
            </div>
          </div>
        </form>
      </nav>
      <div class="add-to-cart-menu">
        <div class="wishlist">
          <a href="./watchlist.html">
            <i class="bi bi-heart"></i>
            <span>Wishlist</span>
          </a>
        </div>
        <div class="my-order">
          <a href="./userOrderPage.html">
            <i class="bi bi-person"></i>
            <span>My Order</span>
          </a>
        </div>
        <div class="cart">
          <a href="./addToCart.html">
            <i class="bi bi-cart"></i>
            <span>Cart</span>
          </a>
        </div>
      </div>
    </header>

    <div class="wrapper">
      <!-- LEFT SUMMARY -->
      <div class="summary">
        <h3>Order Summary</h3>

        <div id="cartItems"></div>

        <div class="total-row">Total: ₹<span id="grandTotal">0</span></div>
      </div>

      <!-- RIGHT FORM -->
      <div class="form-section">
        <h2>Billing Details</h2>
        <form id="checkoutForm">
          <div class="form-group">
            <input type="text" placeholder="Full Name" required />
          </div>

          <div class="form-group">
            <input type="email" placeholder="Email Address" required />
          </div>

          <div class="form-group">
            <input type="tel" placeholder="Phone Number" required />
          </div>

          <div class="form-group">
            <input type="text" placeholder="Shipping Address" required />
          </div>

          <div class="form-group">
            <select id="paymentMethod" required title="payment option">
              <option value="">Select Payment Method</option>
              <option value="Cash on Delivery">Cash on Delivery</option>
              <option value="UPI">UPI</option>
              <option value="Credit">Debit/Credit Card</option>
            </select>
          </div>

          <div id="extraFields" class="payment-extra"></div>

          <button type="submit">Complete Purchase</button>
        </form>
      </div>
    </div>
    <!-- CONFIRMATION POPUP -->
    <div id="confirmationPopup" class="confirmation">
      <div class="confirmation-box">
        <div class="checkmark"></div>
        <h2>Payment Successful</h2>
        <p>Your booking has been confirmed.</p>
        <p class="order-id">Order ID: <span id="orderNumber"></span></p>
        <button type="button" onclick="continueShopping()">
          Continue Shopping
        </button>
      </div>
    </div>
    <script src="orderInfoPage.js"></script>
  </body>
</html>
